services:
  ollama-server:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-server
    pull_policy: always
    tty: true
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=1h
    volumes:
      - ./ollama/ollama-server:/root/.ollama
    # limites para não travar o Windows/WSL
    cpus: 3.5
    mem_limit: 6g
